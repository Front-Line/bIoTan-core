[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biotan"
version = "0.2.0"
description = "Zero-config, peer-relative anomaly backtesting for fleets of homogeneous IoT assets (free open core)."
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Victor Minbeom Joo", email = "contact@frontli.ne.kr" }]
keywords = [
    "anomaly detection",
    "iot",
    "fleet",
    "predictive maintenance",
    "peer-relative",
    "backtest",
    "time series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.scripts]
biotan = "biotan.__main__:main"

[project.urls]
Homepage = "https://biotan.frontli.ne.kr"
Repository = "https://github.com/Front-Line/bIoTan-core"
Issues = "https://github.com/Front-Line/bIoTan-core/issues"

[tool.setuptools]
packages = ["biotan"]
