[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "biotan-core"
version = "0.1.0"
description = "Zero-config, peer-relative anomaly backtesting for fleets of homogeneous IoT assets (free open core)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Victor Minbeom Joo d/b/a Front-Line", email = "contact@frontli.ne.kr" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["biotan"]
